# golangci-lint v2. `make lint` runs it; CI would too.
version: "2"

linters:
  default: standard
  enable:
    - errorlint    # errors.Is/As and %w, never == or type switches on errors
    - gocritic
    - misspell
    - nolintlint
    - revive
    - sloglint     # constant log messages, data in attributes, no global logger
    - unconvert
    - unparam
  settings:
    sloglint:
      static-msg: true
      kv-only: true
      no-global: all
      context: scope
      key-naming-case: snake
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters: [unparam]

formatters:
  enable:
    - gofmt
    - goimports
